<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#101827"><meta name="description" content="تنزيل الفيديوهات العامة من منشورات X بسهولة">
<link rel="manifest" href="./manifest.webmanifest">
<title>X Video Downloader</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#0b1220,#14243b);color:#f8fafc;min-height:100vh;display:grid;place-items:center;padding:20px}.card{width:min(100%,520px);background:#172338;border:1px solid #33445e;border-radius:26px;padding:26px;box-shadow:0 24px 70px #0006}.logo{width:62px;height:62px;border-radius:20px;background:#0ea5e9;display:grid;place-items:center;font-size:30px;font-weight:900;margin-bottom:18px}h1{font-size:27px;margin:0 0 8px}p{color:#bac8d9;line-height:1.7}.field{display:flex;gap:8px;margin:22px 0 12px;flex-direction:column}input{width:100%;padding:16px;border-radius:14px;border:1px solid #52647d;background:#0c1728;color:white;font-size:16px;direction:ltr;text-align:left}button,.button{border:0;border-radius:14px;padding:15px 18px;background:#0ea5e9;color:#00111d;font-weight:800;font-size:16px;cursor:pointer;text-decoration:none;display:block;text-align:center;width:100%;margin-top:10px}.secondary{background:#263a54;color:#f8fafc}.status{min-height:28px;color:#7dd3fc;font-size:14px}.quality{display:flex;gap:8px;flex-wrap:wrap}.quality button{width:auto;flex:1;min-width:100px}.note{font-size:12px;color:#91a3ba;border-top:1px solid #33445e;padding-top:16px;margin-top:20px}
</style></head>
<body><main class="card">
<div class="logo">X</div><h1>منزّل فيديوهات X</h1>
<p>ضع رابط منشور عام يحتوي على فيديو، اختر الجودة، ثم ابدأ التنزيل.</p>
<div class="field"><input id="post" type="url" placeholder="https://x.com/username/status/..." autocomplete="url"><button id="go">استخراج الفيديو</button></div>
<div id="status" class="status" role="status"></div><div id="formats" class="quality"></div>
<button class="secondary" id="float" type="button">تشغيل الأيقونة العائمة (داخل تطبيق Android)</button>
<a class="button secondary" href="https://github.com/etudiantourg-cmyk/XVideoDownloader/actions" target="_blank" rel="noopener">الحصول على تطبيق Android APK</a>
<p class="note">ملاحظة: تثبيت الموقع على الشاشة الرئيسية لا يمنحه صلاحية الظهور فوق التطبيقات. الأيقونة العائمة تحتاج تطبيق Android المصاحب. التنزيل للمنشورات العامة فقط، واحترم حقوق أصحاب المحتوى.</p>
</main>
<script>
const $=id=>document.getElementById(id), state=$("status"), list=$("formats");
function getId(v){try{const u=new URL(v);if(!/(^|\\.)((x|twitter)\\.com)$/.test(u.hostname))return null;return u.pathname.match(/\\/status\\/(\\d+)/)?.[1]||null}catch{return null}}
$("go").onclick=async()=>{list.innerHTML="";const id=getId($("post").value.trim());if(!id){state.textContent="أدخل رابط منشور صحيحاً من X أو Twitter.";return}state.textContent="جارٍ البحث عن الفيديوهات المتاحة…";$("go").disabled=true;try{const res=await fetch("https://api.fxtwitter.com/2/status/"+id,{headers:{Accept:"application/json"}});if(!res.ok)throw Error("HTTP "+res.status);const data=await res.json();const videos=data?.status?.media?.videos||[];const formats=videos.flatMap(v=>v.formats||[]).filter(f=>{try{const u=new URL(f.url);return u.protocol==="https:"&&(u.hostname==="video.twimg.com"||u.hostname.endsWith(".video.twimg.com"))&&(f.container==="mp4"||u.pathname.toLowerCase().endsWith(".mp4"))}catch{return false}});const unique=[...new Map(formats.map(f=>[f.url,f])).values()].sort((a,b)=>(b.height||0)-(a.height||0));if(!unique.length)throw Error("لم نعثر على MP4. قد يكون المنشور خاصاً أو لا يحتوي على فيديو قابل للتنزيل.");state.textContent="اختر الجودة المناسبة:";unique.forEach((f,i)=>{const b=document.createElement("button");b.textContent=(f.height||"—")+"p MP4";b.onclick=()=>download(f.url,"X_video_"+id+".mp4");list.appendChild(b)});}catch(e){state.textContent=e.message.includes("Failed to fetch")?"تعذر الاتصال من المتصفح. جرّب الأيقونة العائمة داخل تطبيق Android.":e.message}finally{$("go").disabled=false}};
function download(url,name){if(window.AndroidDownloader&&AndroidDownloader.downloadVideo){AndroidDownloader.downloadVideo(url,name);state.textContent="بدأ التنزيل على الهاتف."}else{const a=document.createElement("a");a.href=url;a.download=name;a.rel="noopener";document.body.appendChild(a);a.click();a.remove();state.textContent="إذا لم يبدأ التنزيل، افتح الرابط في المتصفح."}}
$("float").onclick=()=>{if(window.AndroidDownloader?.enableFloating)AndroidDownloader.enableFloating();else state.textContent="هذه الميزة تعمل بعد تثبيت تطبيق Android المصاحب فقط."};
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
if(location.search.includes("url="))$("post").value=new URLSearchParams(location.search).get("url");
</script></body></html>
