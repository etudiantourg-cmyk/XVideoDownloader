name: Android APK
on:
  push:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "8.9"
      - name: Build debug APK
        run: gradle --no-daemon --console=plain assembleDebug --stacktrace
      - name: Run unit tests
        run: gradle --no-daemon --console=plain test --stacktrace
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: XVideoDownloader-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
