services:
  cobalt:
    image: ghcr.io/imputnet/cobalt:11
    init: true
    read_only: true
    restart: unless-stopped
    container_name: universal-video-engine
    ports:
      - "127.0.0.1:9000:9000"
    env_file:
      - .env
    environment:
      API_URL: ${API_URL}
      API_AUTH_REQUIRED: "1"
      API_KEY_URL: "file:///keys.json"
    volumes:
      - ./keys.json:/keys.json:ro
    security_opt:
      - no-new-privileges:true
